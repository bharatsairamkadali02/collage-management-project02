<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Forgot Password | EduManage Pro</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <style>
    body {
      background: linear-gradient(135deg, #0f2540 0%, #1a3c5e 50%, #2563eb 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Segoe UI', system-ui, sans-serif;
      padding: 20px;
    }
    .auth-card {
      background: white;
      border-radius: 16px;
      box-shadow: 0 20px 40px rgba(0,0,0,0.25);
      width: 100%;
      max-width: 440px;
      overflow: hidden;
    }
  </style>
</head>
<body>

<div class="auth-card p-4 p-sm-5">
  <div class="text-center mb-4">
    <div class="rounded-circle bg-primary bg-opacity-10 text-primary d-inline-flex align-items-center justify-content-center p-3 mb-2">
      <i class="bi bi-key-fill fs-2"></i>
    </div>
    <h4 class="fw-bold text-primary">Password Recovery</h4>
    <p class="text-muted small">Enter your institutional email to generate a secure reset token</p>
  </div>

  {% with messages = get_flashed_messages(with_categories=true) %}
    {% if messages %}
      {% for category, message in messages %}
        <div class="alert alert-{{ category if category != 'error' else 'danger' }} small" role="alert">
          {{ message }}
        </div>
      {% endfor %}
    {% endif %}
  {% endwith %}

  <form method="POST" action="{{ url_for('auth.forgot_password') }}">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <div class="mb-4">
      <label class="form-label fw-semibold small text-muted">Email Address</label>
      <input type="email" name="email" class="form-control" required placeholder="user@college.edu">
    </div>

    <button type="submit" class="btn btn-primary w-100 py-2 fw-bold">
      Send Reset Link
    </button>
  </form>

  <div class="text-center mt-4">
    <a href="{{ url_for('auth.login') }}" class="small text-decoration-none text-muted">
      <i class="bi bi-arrow-left me-1"></i> Back to Sign In
    </a>
  </div>
</div>

</body>
</html>
