# =============================================================================
# College Management System – Nginx Configuration
# Location: /etc/nginx/sites-available/college-management
# Enable:   ln -s /etc/nginx/sites-available/college-management \
#                  /etc/nginx/sites-enabled/college-management
# =============================================================================

# Upstream Gunicorn application server
upstream college_app {
    server 127.0.0.1:8000 fail_timeout=0;
    keepalive 32;
}

# ---------------------------------------------------------------------------
# HTTP server block – serves the application (add HTTPS block after cert setup)
# ---------------------------------------------------------------------------
server {
    listen 80;
    listen [::]:80;

    # Replace '_' with your domain or EC2 public IP after deployment
    server_name _;

    # Maximum upload size (match Flask's MAX_CONTENT_LENGTH)
    client_max_body_size 50M;

    # Request timeouts
    client_header_timeout 60s;
    client_body_timeout   60s;
    send_timeout          120s;

    # ── Security Headers ────────────────────────────────────────────────────
    add_header X-Frame-Options           "SAMEORIGIN"           always;
    add_header X-Content-Type-Options    "nosniff"              always;
    add_header X-XSS-Protection          "1; mode=block"        always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy        "geolocation=(), microphone=()" always;

    # ── Compression ─────────────────────────────────────────────────────────
    gzip on;
    gzip_types text/plain text/css application/json application/javascript
               text/xml application/xml application/xml+rss text/javascript;
    gzip_min_length 1024;
    gzip_comp_level 5;

    # ── Static Files (served directly by Nginx) ──────────────────────────────
    location /static/ {
        alias /opt/college-app/backend/static/;
        expires 30d;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # ── Favicon ─────────────────────────────────────────────────────────────
    location = /favicon.ico {
        alias /opt/college-app/backend/static/favicon.ico;
        access_log off;
        log_not_found off;
    }

    # ── Health Check ────────────────────────────────────────────────────────
    location = /health {
        proxy_pass         http://college_app/health;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        access_log         off;
    }

    # ── Deny Hidden Files (e.g. .env, .git) ─────────────────────────────────
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }

    # ── Main Application – Proxy to Gunicorn ────────────────────────────────
    location / {
        proxy_pass              http://college_app;

        # Pass real client info to Flask
        proxy_set_header        Host              $http_host;
        proxy_set_header        X-Real-IP         $remote_addr;
        proxy_set_header        X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header        X-Forwarded-Proto $scheme;

        # Connection reuse
        proxy_http_version      1.1;
        proxy_set_header        Connection        "";

        # Timeouts
        proxy_connect_timeout   60s;
        proxy_send_timeout      120s;
        proxy_read_timeout      120s;

        # Buffering
        proxy_buffering         on;
        proxy_buffer_size       16k;
        proxy_buffers           4 64k;
        proxy_busy_buffers_size 64k;

        # Redirect handling
        proxy_redirect          off;
    }

    # ── Custom Error Pages ──────────────────────────────────────────────────
    error_page 404              /404.html;
    error_page 500 502 503 504  /500.html;

    location = /404.html {
        root /opt/college-app/backend/static/errors/;
        internal;
    }

    location = /500.html {
        root /opt/college-app/backend/static/errors/;
        internal;
    }

    # ── Logging ─────────────────────────────────────────────────────────────
    access_log /var/log/nginx/college-management-access.log combined;
    error_log  /var/log/nginx/college-management-error.log  warn;
}
