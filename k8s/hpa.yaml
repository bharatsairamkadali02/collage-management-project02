# ──────────────────────────────────────────────────────────
# hpa.yaml  (Horizontal Pod Autoscaler)
# Automatically increases/decreases number of pods
# based on CPU usage. Optional but recommended.
# ──────────────────────────────────────────────────────────
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: college-app-hpa
  namespace: college-management
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: college-app
  minReplicas: 2       # Always keep at least 2 pods running
  maxReplicas: 5       # Scale up to 5 pods at peak load
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70   # Scale up if CPU > 70%
