# ──────────────────────────────────────────────────────────
# secret.yaml
# Stores SENSITIVE values (passwords, keys) in base64.
# IMPORTANT: Replace the values below with your real base64-encoded values.
#
# How to encode a value:
#   Linux/Mac: echo -n "your_value" | base64
#   Windows:   [Convert]::ToBase64String([Text.Encoding]::UTF8.GetBytes("your_value"))
#
# Current encoded values:
#   DB_PASSWORD:            (your RDS password — base64 encoded)
#   SECRET_KEY:             (a random 64-char hex string — base64 encoded)
#   INITIAL_ADMIN_PASSWORD: QWRtaW5QYXNzd29yZDEyMyE=  (= AdminPassword123!)
# ──────────────────────────────────────────────────────────
apiVersion: v1
kind: Secret
metadata:
  name: college-app-secret
  namespace: college-management
type: Opaque
data:
  # Replace REPLACE_WITH_BASE64_RDS_PASSWORD with:
  # echo -n "your_actual_rds_password" | base64
  DB_PASSWORD: "REPLACE_WITH_BASE64_RDS_PASSWORD"

  # Replace REPLACE_WITH_BASE64_SECRET_KEY with:
  # echo -n "$(openssl rand -hex 32)" | base64
  SECRET_KEY: "REPLACE_WITH_BASE64_SECRET_KEY"

  # AdminPassword123! in base64 — change if you want a different password
  INITIAL_ADMIN_PASSWORD: "QWRtaW5QYXNzd29yZDEyMyE="
