# ──────────────────────────────────────────────────────────
# service.yaml
# Exposes pods on Minikube via NodePort 30080.
# Nginx on the EC2 host proxies ports 80 and 8080 to this NodePort.
# ──────────────────────────────────────────────────────────
apiVersion: v1
kind: Service
metadata:
  name: college-app-service
  namespace: college-management
spec:
  selector:
    app: college-app
  type: NodePort
  ports:
    - name: http
      protocol: TCP
      port: 80
      targetPort: 5000
      nodePort: 30080
